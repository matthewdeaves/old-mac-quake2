// Quake II dedicated server configuration.
//
// This file has to live in the GAME directory, as baseq2/server.cfg, and it is
// read because the launch line says +exec server.cfg. Quake II's exec searches
// the game directory, not the directory q2ded sits in, so a copy left beside
// the binary is silently never read.

// ---------------------------------------------------------------- identity
set hostname "Quake II"
set maxclients 8

// ----------------------------------------------------------------- privacy
//
// public 0 keeps the server off the master list, so it appears in nobody's
// in-game browser. It is already the default; it is set here because it is the
// one line that keeps this server unlisted, and a default can change under you.
//
// Do NOT run the `setmaster` console command. It forces public back to 1 as
// its first act (src/server/sv_cmd.c), so a single command undoes this line.
set public 0

// A joining player must supply this. Unlike Quake 1, Quake II does have a
// password, so this is a real lock rather than just obscurity. Set it to
// something long and random, and keep it different from rcon_password.
set password ""

// Remote admin. With this set you can change map and run commands from inside
// the game on any client, see README.md. Leave it empty to disable rcon
// completely. Note the password crosses the network in the clear.
set rcon_password ""

// -------------------------------------------------------------- match rules
set deathmatch 1
set coop 0
set timelimit 15
set fraglimit 20

// dmflags is a bit field. 16 is DF_NO_FRIENDLY_FIRE. Others worth knowing:
//   8    no falling damage      32   no health pickups
//   64   no armor              256   same map every time
//   512  no weapon stay
set dmflags 16

// ------------------------------------------------------------------ comfort
// Seconds before a silent client is dropped. Generous on purpose: a vintage
// Mac on a slow link should survive a brief stall.
set timeout 125

// old-mac-quake2#46: a client got dropped mid-handshake ("<name> overflowed")
// during a concurrent join. Root cause: this cvar's engine-default value (7)
// leaves bit 8 off. Per the engine's own doc (yquake2-server/doc/040_cvarlist.md):
// with bit 8 off, a long CS_STATUSBAR string -- ours is 408 chars, spanning 7
// configstring slots -- gets sent as the full string AND THEN increasingly
// smaller redundant substrings of the same data, one per remaining slot
// (~1128 bytes of pure duplication on top of the real ~412-byte payload).
// That stretches one atomic write into up to 7 resend packets, and it was
// mid-cascade (index 6, the first duplicate substring) when a second
// player's connect traffic landed in this client's own reliable buffer and
// tipped it over MAX_MSGLEN. Bit 8 makes the engine send only the real
// string once, closing that whole multi-packet window. Leaving bit 16
// (baselines head-start) off: unrelated to this bug, untested here.
set sv_optimize_mp_loadtime "15"

// ------------------------------------------------------- attack surface
//
// Downloads push server content OUT to connecting clients. Both of our clients
// already carry the same content the server does, because they install it from
// the same release, so leaving these on only ever serves a stranger.
set allow_download 0
set allow_download_maps 0
set allow_download_players 0
set allow_download_models 0
set allow_download_sounds 0

// ------------------------------------------------------------- map rotation
// Read by the game library, not the engine: when a limit is hit it takes the
// next name from this list. Keep it to maps you know run well on the oldest
// machine that will connect.
set sv_maplist "q2dm1 q2dm2 q2dm3 q2dm4 q2dm5"
