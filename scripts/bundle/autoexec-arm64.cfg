// yquake2 5.11 - per-arch baseline for Apple Silicon (arm64)
//   macOS 11 Big Sur and later.
//
// This is the only slice in the fat that does not link a real SDL 1.2. There
// is no arm64 build of SDL 1.2 and there never will be, so this slice links
// sdl12-compat, which reimplements the 1.2 API on top of a real SDL2 that we
// build and ship ourselves. dyld grades a fat by CPU subtype alone, so the
// PowerPC and Intel slices are untouched and keep the genuine SDL 1.2.
// docs/adr/0015.
//
// BENCHED, on the orchestration Mac (Apple M5, macOS 26, GL 2.1 Metal - 90.5),
// demo1.dm2, vsync off, nothing else running:
//
//   640x480 windowed                        483 fps
//   1710x1107 windowed                      284 fps
//   fullscreen, desktop capture             444 fps
//
// Two traps are worth recording, because both produced a wrong number first:
//   * vsync. Apple's GL defaults it ON, which pins the result at 59.5 fps and
//     looks exactly like a slow renderer. gl_swapinterval 0 for benching.
//   * other instances of the game still running. A stale pair of windows in
//     the background turned that 444 fps fullscreen figure into 34.7, which
//     was very nearly written down as "the shim's GL scaling path is slow".
//     It is not.
//
// Everything below is at or near maximum. There is nothing to save: the
// floor case for this slice is an M1 Air, far above what this renderer needs.

// Display ----------------------------------------------------------
// vid_desktopfullscreen 1: satisfy the fullscreen request at the panel's own
// resolution (a same-mode capture) rather than switching the display to a
// smaller mode and letting it stretch. That matters more here than anywhere
// else in the fleet, because Apple Silicon Macs ship a dozen different panels
// and an external display can change the answer between launches. The engine
// reported the desktop correctly through the shim, at 1710x1107 on the
// built-in panel and 2560x1080 on an attached monitor.
set vid_fullscreen 1
set vid_desktopfullscreen 1
set gl_mode -1
set gl_customwidth 1920                  // fallback only, for the case where the
set gl_customheight 1080                 // capture above does not engage
set gl_swapinterval 1                    // vsync ON for play, unlike benching

// Texture & VRAM ----------------------------------------------------
set gl_picmip 0                          // full-size textures
set gl_skymip 0
set gl_round_down 0                      // round texture sizes UP
set gl_retexturing 1                     // hi-res replacement textures, if present
set gl_texturemode GL_LINEAR_MIPMAP_LINEAR
set gl_anisotropic 16
set gl_msaa_samples 4

// Dynamic lights ---------------------------------------------------
// ON, unlike every PowerPC slice and the GMA ones. R_BuildLightMap plus
// R_AddDynamicLights is per-luxel float work on the CPU and it is what binds
// on a 500 MHz G4. It is not remotely binding here.
set gl_dynamic 1
set gl_flashblend 0                      // real dynamic lights, not billboard halos

// Shadows ----------------------------------------------------------
set gl_shadows 1
set gl_stencilshadow 1                   // real projected shadow volumes. Measured at
                                         // ~24% on mini-g4; free at these frame rates
set gl_glows 1
set gl_trans_lighting 1
set gl_caustics 1
set gl_bloom 0                           // fullscreen post, and broken on GL1 drivers

// Particles --------------------------------------------------------
set gl_ext_pointparameters 1
set gl_ext_multitexture 1
set gl_ext_mtexcombine 1
set gl_particle_min_size 2
set gl_particle_max_size 64

// Frame submission -------------------------------------------------
set gl_finish 0
set gl_clear 0
set gl_ztrick 0
set gl_zfix 1
set gl_polyblend 1

// View / cosmetic --------------------------------------------------
set gl_modulate 1
set gl_overbrightbits 2
set intensity 2
set vid_gamma 1.0
set horplus 1                            // widescreen-correct FOV, which every
                                         // Apple Silicon Mac needs

// Fog --------------------------------------------------------------
set gl_fog 1
set gl_fog_mode 0
set gl_fog_start 64
set gl_fog_end 2048
set gl_fog_red 0.5
set gl_fog_green 0.5
set gl_fog_blue 0.55

set gl_waterwarp 1
set gl_lightmap_subrect 0                // gl_dynamic is 1 here, so this is live
set gl_groupdraw 1

// Client tier ------------------------------------------------------
set cl_maxfps 250
set cl_gun 2
set cl_particles 1
set cl_lights 1
set cl_blend 1
set cl_entities 1

set s_khz 44

set r_2D_unfiltered 0                    // filter the HUD too; there is fill to spare

// World decals -----------------------------------------------------
set gl_decals 1
set gl_decal_max 256
set gl_decal_life 60
set gl_decal_fade 5

set gl_pointsprites 1

// Watch "Tactical Computer" companion ------------------------------
// See autoexec-mini-intel.cfg for the rationale.
set watch_host "auto"
set watch_port "27999"
