// yquake2 5.11 — per-machine autoexec for the G5 Dual 2.7 tower
//   PowerMac7,3 (Power Mac G5, Late 2004/2005) — Dual PPC 970 @ 2.7 GHz,
//   AltiVec, ATI Radeon 9600 (RV351) 128 MB VRAM AGP, native 1680x1050,
//   three OS partitions on ONE physical box, all sharing this hw.model:
//   g5-panther (10.3.9 Panther), g5-tiger (10.4.11 Tiger), g5-desktop
//   (10.5.8 Leopard). Like PowerMac1,1 (yosemite/yosemite-tiger), one
//   hw.model can only select one overlay — there is no per-OS branch —
//   so this file applies on whichever of the three is booted.
//   Fat binary slice: ppc970.
//
// Issue #54: had NO per-machine overlay at all (unlike imac-g5, the other
// ppc970 box, which has had one since it joined the fleet), so all three
// aliases silently ran the generic autoexec-ppc970 baseline, including
// its conservative gl_flashblend 1. User-observed on g5-tiger during the
// v2.11.0 RC retest: the blaster bolt's own dlight rendered as a flat
// grey/white disc floating in front of it (gl_flashblend's immediate-mode
// billboard fan, r_light.c R_RenderDlight) instead of lighting the
// surrounding geometry.
//
// MEASURED here (g5-tiger, 10.4.11, demo1 @ native 1680x1050,
// vid_desktopfullscreen same-mode capture, interleaved 0/1/0/1, all four
// runs bit-identical each way — zero noise on this demo):
//   gl_flashblend 0   156.2 fps
//   gl_flashblend 1   153.4 fps
// Disabling it is BOTH the visual fix and ~1.8% faster here — unlike the
// mini-g4/R9200 case where stencil shadows had a real driver-specific
// cost, real per-dlight lightmap reblend is cheaper than the billboard
// fan on this R300 + dual-970 pairing. Same conclusion imac-g5 reached
// on the same GPU family (its own overlay's rationale: "prefer real
// lightmap reblend") — checked independently on this box, not assumed
// to transfer.
set gl_flashblend 0

// Everything below this line is NOT yet benched on this specific box —
// conservatively inherited from the generic ppc970 baseline (Layer 1),
// restated here so this overlay reads as a complete profile like the
// rest of the fleet's, and so the next pass has a documented place to
// raise a knob rather than guessing from GPU class. This box has real
// headroom over imac-g5's single 2.0 GHz 970FX (dual 2.7 GHz cores, same
// GPU tier) — dynamic lights, retexturing and the multitex-combiner
// features (glows/caustics/trans_lighting) are plausible next A/Bs.

// Display ----------------------------------------------------------
// Same R300 same-mode-capture requirement as imac-g5 (Leopard driver
// hard-hangs on a non-native fullscreen mode SWITCH) — already forced by
// the ppc970 baseline (Layer 1) for every G5 regardless of overlay, but
// restated here for a reader who only looks at this file. bench.sh has
// NO case for g5-panther/g5-tiger/g5-desktop yet (issue #31) — hand-run
// any bench on this box with vid_desktopfullscreen forced and no custom
// resolution override, the way this ticket's own measurement was taken.
set vid_fullscreen 1
set vid_desktopfullscreen 1
set gl_mode -1
set gl_customwidth 1680
set gl_customheight 1050

// Texture & VRAM ----------------------------------------------------
set gl_picmip 0
set gl_skymip 0
set gl_round_down 0
set gl_retexturing 0                     // conservative floor, unbenched here — likely affordable, same VRAM budget as imac-g5
set gl_texturemode GL_LINEAR_MIPMAP_LINEAR
set gl_anisotropic 2                     // conservative floor; a Radeon 9600 supports 16x — raise after bench
set gl_farsee 1                          // matches the rest of the G5/Intel/AS tier (issue #24)

// Dynamic lights ---------------------------------------------------
set gl_dynamic 0                         // conservative floor, unbenched here — dual 2.7 GHz likely eats this for breakfast, same as imac-g5

// Shadows / advanced surfaces --------------------------------------
set gl_shadows 1
set gl_stencilshadow 0                   // conservative floor, unbenched here
set gl_glows 0                           // multitex feature, unbenched here — the 9600 has the combiners
set gl_trans_lighting 0                  //   "
set gl_caustics 0                        //   "
set gl_bloom 0                           // OFF — see #33, prohibitive/broken across the fixed-func GL1 path fleet-wide

// Particles --------------------------------------------------------
set gl_ext_pointparameters 1
set gl_particle_min_size 1
set gl_particle_max_size 32

// Frame submission -------------------------------------------------
set gl_finish 0
set gl_clear 0
set gl_ztrick 0
set gl_zfix 1
set gl_polyblend 1
set gl_lerpmodels 1                      // AltiVec lerp path applies (970 has AltiVec)

// View / cosmetic --------------------------------------------------
set gl_modulate 1.4
set gl_overbrightbits 2
set intensity 2
set gl_minlight 8
set r_2D_unfiltered 1
set horplus 1

// Fog --------------------------------------------------------------
set gl_fog 1
set gl_fog_mode 0
set gl_fog_start 64
set gl_fog_end 2048
set gl_fog_red 0.5
set gl_fog_green 0.5
set gl_fog_blue 0.55

// Waterwarp / lightmap subrect -------------------------------------
set gl_waterwarp 1
set gl_lightmap_subrect 1

// Group-draw ---------------------------------------------------------
set gl_groupdraw 1

// World decals -------------------------------------------------------
set gl_decals 1
set gl_decal_max 16
set gl_decal_life 20
set gl_decal_fade 3

// Client / sound -----------------------------------------------------
set cl_maxfps 90                         // conservative bump over the G4 default; dual 2.7 GHz has CPU to spare
set cl_gun 2
set s_khz 44

// MSAA (CVAR_LATCH) — off until benched on this box.
set gl_msaa_samples 0
