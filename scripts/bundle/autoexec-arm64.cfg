// yquake2 5.11 - per-arch baseline for Apple Silicon (arm64)
//   macOS 11 Big Sur and later.
//
// This is the only slice in the fat that does not link a real SDL 1.2. There
// is no arm64 build of SDL 1.2 and there never will be, so this slice links
// sdl12-compat, which reimplements the 1.2 API on top of a real SDL2 that we
// build and ship ourselves. dyld grades a fat by CPU subtype alone, so the
// PowerPC and Intel slices are untouched and keep the genuine SDL 1.2.
// docs/adr/0015.
//
// BENCHED, on the orchestration Mac (Apple M5, macOS 26, GL 2.1 Metal - 90.5),
// demo1.dm2, vsync off, nothing else running:
//
//   640x480 windowed                        483 fps
//   1710x1107 windowed                      284 fps
//   fullscreen, desktop capture             444 fps
//
// Two traps are worth recording, because both produced a wrong number first:
//   * vsync. Apple's GL defaults it ON, which pins the result at 59.5 fps and
//     looks exactly like a slow renderer. gl_swapinterval 0 for benching.
//   * other instances of the game still running. A stale pair of windows in
//     the background turned that 444 fps fullscreen figure into 34.7, which
//     was very nearly written down as "the shim's GL scaling path is slow".
//     It is not.
//
// Everything below is at or near maximum. There is nothing to save: the
// floor case for this slice is an M1 Air, far above what this renderer needs.

// Display ----------------------------------------------------------
// Fullscreen, but DESKTOP fullscreen, and the difference is not cosmetic.
//
// The arm64 slice links sdl12-compat over SDL2. Asking for a real display mode
// change (vid_desktopfullscreen 0) wedges the process inside the buffer swap:
// the whole game loop runs from the Cocoa launch notification, and
// SDL_GL_SwapBuffers blocks forever in _pthread_cond_wait, so the window is
// drawn black and never updates. Borderless desktop fullscreen never changes
// the display mode and does not hit it.
//
// Measured on macOS 26 / M5, same build, same session:
//   vid_fullscreen 1, vid_desktopfullscreen 0 -> black window, 0.3% CPU,
//                                               stuck in SDL_GL_SwapBuffers
//   vid_fullscreen 1, vid_desktopfullscreen 1 -> renders, 14% CPU, vsync-paced
//
// So set BOTH. Setting vid_fullscreen alone reintroduces the hang, which is
// how this file previously came to ship windowed.
//
// PowerPC and Intel link a real SDL 1.2 and are unaffected, which is why every
// other slice sets plain fullscreen.
set vid_fullscreen 1
set vid_desktopfullscreen 1
set gl_mode -1
set gl_customwidth 1920                  // fallback only, for the case where the
set gl_customheight 1080                 // capture above does not engage
set gl_swapinterval 1                    // vsync ON for play, unlike benching

// Texture & VRAM ----------------------------------------------------
set gl_picmip 0                          // full-size textures
set gl_skymip 0
set gl_round_down 0                      // round texture sizes UP
set gl_retexturing 1                     // hi-res replacement textures, if present
set gl_farsee 1                          // far clip 4096 -> 8192 (CVAR_LATCH). See the note at the end of this file.
set gl_texturemode GL_LINEAR_MIPMAP_LINEAR
set gl_anisotropic 16
set gl_msaa_samples 4

// Dynamic lights ---------------------------------------------------
// ON, unlike every PowerPC slice and the GMA ones. R_BuildLightMap plus
// R_AddDynamicLights is per-luxel float work on the CPU and it is what binds
// on a 500 MHz G4. It is not remotely binding here.
set gl_dynamic 1
set gl_flashblend 0                      // real dynamic lights, not billboard halos

// Shadows ----------------------------------------------------------
set gl_shadows 1
set gl_stencilshadow 1                   // real projected shadow volumes. Measured at
                                         // ~24% on mini-g4; free at these frame rates
set gl_glows 1
set gl_trans_lighting 1
set gl_caustics 1
set gl_bloom 0                           // fullscreen post, and broken on GL1 drivers

// Particles --------------------------------------------------------
set gl_ext_pointparameters 1
set gl_ext_multitexture 1
set gl_ext_mtexcombine 1
set gl_particle_min_size 2
set gl_particle_max_size 64

// Frame submission -------------------------------------------------
set gl_finish 0
set gl_clear 0
set gl_ztrick 0
set gl_zfix 1
set gl_polyblend 1

// View / cosmetic --------------------------------------------------
set gl_modulate 1
set gl_overbrightbits 2
set intensity 2
set vid_gamma 1.0
set horplus 1                            // widescreen-correct FOV, which every
                                         // Apple Silicon Mac needs

// Fog --------------------------------------------------------------
set gl_fog 1
set gl_fog_mode 0
set gl_fog_start 64
set gl_fog_end 2048
set gl_fog_red 0.5
set gl_fog_green 0.5
set gl_fog_blue 0.55

set gl_waterwarp 1
set gl_lightmap_subrect 0                // gl_dynamic is 1 here, so this is live
set gl_groupdraw 1

// Client tier ------------------------------------------------------
set cl_maxfps 250
set cl_gun 2
set cl_particles 1
set cl_lights 1
set cl_blend 1
set cl_entities 1

set s_khz 44

set r_2D_unfiltered 0                    // filter the HUD too; there is fill to spare

// World decals -----------------------------------------------------
set gl_decals 1
set gl_decal_max 256
set gl_decal_life 60
set gl_decal_fade 5

set gl_pointsprites 1

// Watch "Tactical Computer" companion ------------------------------
// See autoexec-mini-intel.cfg for the rationale.
set watch_host "auto"
set watch_port "27999"


// gl_farsee, added 2026-08-22, issue #24
// -------------------------------------
// Doubles the far clip plane from 4096 to 8192 (r_main.c:817) and rescales the
// sky to match (r_warp.c:658). x86_64 and both Intel minis have had it since
// the Intel bring-up; every PowerPC machine and arm64 did not, so the fastest
// hardware in the fleet had a feature the rest lacked.
//
// What was measured, on quicksilver (733 MHz 7450, Radeon 9000 Pro, 10.4.11),
// demo1 AND demo2 at 1024x768 fullscreen, gl_farsee pinned explicitly on the
// command line for both legs:
//
//     visual difference, 20 frames    RMSE 1e-5 to 1.5e-3
//                                     worst frame 22 pixels of 786432
//     control, same setting twice     exactly 0
//     fps cost (issue #24)            57.15 vs 57.05, 0.17%
//
// READ THAT HONESTLY: it is not evidence the feature is free. It is evidence
// that neither retail demo has any geometry between 4096 and 8192 units, so
// the demos cannot price it. The cost lands only in maps that DO have distant
// geometry, and it is unmeasured there.
//
// So this is on where there is headroom to absorb an unmeasured cost: the G4s
// sit near 57-66 fps against a 40 fps floor, the G5 and Apple Silicon far
// higher. It is deliberately NOT on for ppc750: the G3 reads 25.2 fps at
// 1024x768 against a 20 fps floor, which is the least headroom in the fleet
// and the wrong place to spend an unpriced feature. i386 has never been run on
// hardware at all.
