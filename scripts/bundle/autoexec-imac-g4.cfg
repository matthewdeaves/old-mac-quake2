// yquake2 5.11 — per-machine autoexec for the iMac G4 "sunflower / lamp"
//   PowerMac4,2 (15" Flat Panel, 2002) / PowerMac6,1 / PowerMac6,3
//   (USB 2.0 15"/17"/20", 2003–04)
//   700 MHz–1.25 GHz PPC 7445/7455, GeForce2 MX / GeForce4 MX /
//   Radeon 9000 / Radeon 9200, Mac OS X 10.2–10.5
//   Fat binary slice: ppc_7400
//
// *** UNTESTED ON HARDWARE *** — there is no iMac G4 in the bench fleet.
//
// Design rationale
// ----------------
// The family spans a wide range: the 700 MHz / GeForce2 MX low end is
// slightly ahead of sawtooth (500 MHz 7400, same GPU), while the 1.25 GHz
// / Radeon 9200 high end matches mini-g4 outright. With no way to tell
// them apart from hw.model alone, this overlay takes the sawtooth stack —
// the validated floor for the weakest member. A faster iMac G4 will leave
// framerate on the table; that is the right way round for a profile
// nobody has run. Everything here is a cvar, so dial it up from the
// console if you have one of the quick ones.
//
// Worst case of a wrong hw.model id: this file simply never loads and the
// machine falls back to the ppc7400 baseline, which is also safe.
//
// Display — fixed 1024x768, NOT native panel res. Deliberately different
// from the QuakeSpasm sister port, which takes native here. The 17"/20"
// panels are 1440x900 / 1680x1050, and a GeForce4 MX asked to fill those
// with this visual stack would fall well short; 1024x768 is the res every
// other G4 overlay in this port is tuned and benched at. The mode switch
// this implies is safe on these GPUs — the hard-hang hazard is specific to
// the R300 (Radeon 9600/9700/9800) Leopard driver, and no iMac G4 shipped
// one. See docs/CONFIG.md for the divergence note.
set vid_fullscreen 1
set vid_desktopfullscreen 0
set gl_mode -1
set gl_customwidth 1024
set gl_customheight 768

// Texture & VRAM ----------------------------------------------------
set gl_picmip 0
set gl_skymip 0
set gl_round_down 0
set gl_retexturing 0                     // hi-res pack off — 32 MB VRAM at the low end
set gl_texturemode GL_LINEAR_MIPMAP_LINEAR
set gl_anisotropic 2                     // GF2 MX tops out low; 2x is the honest setting

// Dynamic lights ---------------------------------------------------
set gl_dynamic 0                         // lightmap reblend is the expensive path on a GF2 MX
set gl_flashblend 1                      // cheap blended halo instead

// Shadows ----------------------------------------------------------
set gl_shadows 1
set gl_stencilshadow 1                   // benched ~19% on sawtooth's GF2 MX — above floor
set gl_glows 0
set gl_trans_lighting 0
set gl_caustics 0
set gl_bloom 0

// Particles --------------------------------------------------------
set gl_ext_pointparameters 1
set gl_particle_min_size 1
set gl_particle_max_size 32
set gl_minlight 8

// Frame submission -------------------------------------------------
set gl_finish 0
set gl_clear 0
set gl_ztrick 0
set gl_polyblend 1

// View / cosmetic --------------------------------------------------
set gl_lerpmodels 1
set gl_modulate 1.4
set gl_overbrightbits 2
set intensity 2
set horplus 1

// Fog (Phase C, cvar-driven GL_FOG) --------------------------------
set gl_fog 1
set gl_fog_mode 0
set gl_fog_start 64
set gl_fog_end 2048
set gl_fog_red 0.5
set gl_fog_green 0.5
set gl_fog_blue 0.55

// Waterwarp --------------------------------------------------------
set gl_waterwarp 1

// Lightmap subrect upload — no-op while gl_dynamic is 0
set gl_lightmap_subrect 1

// Group-draw -------------------------------------------------------
set gl_groupdraw 1

// Client tier ------------------------------------------------------
set cl_maxfps 60
set cl_gun 1

// Sound ------------------------------------------------------------
set s_khz 22

// Tier 2 — HUD pics on GL_NEAREST regardless of gl_texturemode
set r_2D_unfiltered 1

// World decals -----------------------------------------------------
set gl_decals 1
set gl_decal_max 16
set gl_decal_life 20
set gl_decal_fade 3

// MSAA (CVAR_LATCH — requires vid_restart to switch) ----------------
set gl_msaa_samples 0

// Watch "Tactical Computer" companion ------------------------------
set watch_host "auto"
set watch_port "27999"
