// yquake2 5.11 — GPU tier: ATI R300/R420 family (Radeon 9500-9800,
// X600-X850), 128 MB+, on a G5 (ppc970 slice), when hw.model matched no
// per-machine overlay (#87). Picked in common/misc.c from the display's CGL
// renderer before VID_Init. Covers the G5 towers other than PowerMac7,3.
//
// Values: the G5 tower's measured profile (autoexec-g5-dual.cfg, #86) with
// no resolution (the desktop mode is captured, never switched: the R300
// Leopard driver can hang on a mode switch, ADR 0008) and bloom off, since
// a single-CPU G5 or a larger desktop may not have the tower's headroom.
// Measured on g5-tiger with -nomachineoverlay: see #87.

set gl_flashblend 0
set vid_fullscreen 1
set vid_desktopfullscreen 1
set gl_picmip 0
set gl_skymip 0
set gl_round_down 0
set gl_retexturing 1
set gl_texturemode GL_LINEAR_MIPMAP_LINEAR
set gl_anisotropic 16
set gl_farsee 1
set gl_dynamic 1
set gl_shadows 1
set gl_stencilshadow 0
set gl_glows 1
set gl_trans_lighting 1
set gl_caustics 1
set gl_bloom 0                           // see header
set gl_ext_pointparameters 1
set gl_particle_min_size 1
set gl_particle_max_size 32
set gl_finish 0
set gl_clear 0
set gl_ztrick 0
set gl_zfix 1
set gl_polyblend 1
set gl_lerpmodels 1
set gl_modulate 1.4
set gl_overbrightbits 2
set intensity 2
set gl_minlight 8
set r_2D_unfiltered 1
set horplus 1
set gl_fog 1
set gl_fog_mode 0
set gl_fog_start 64
set gl_fog_end 2048
set gl_fog_red 0.5
set gl_fog_green 0.5
set gl_fog_blue 0.55
set gl_waterwarp 1
set gl_lightmap_subrect 1
set gl_groupdraw 1
set gl_decals 1
set gl_decal_max 16
set gl_decal_life 20
set gl_decal_fade 3
set cl_maxfps 90
set cl_gun 2
set s_khz 44
set gl_msaa_samples 0
set q2_overlay_gpu "radeon"
