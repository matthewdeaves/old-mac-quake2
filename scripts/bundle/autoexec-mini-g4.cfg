// yquake2 5.11 — per-machine autoexec for mini-g4
//   PowerMac10,1 (2005) — PPC 7447A @ 1.25 GHz, ATI Radeon 9200 32 MB, 10.4.11 Tiger
//   Fat binary slice: ppc_7400 (binary compatible with 7447A)
//
// Design rationale
// ----------------
// Fastest PPC box. The 1.25 GHz 7447A has roughly 2.5x the CPU of the
// 733 MHz quicksilver, but the Radeon 9200 is one tier BELOW the
// quicksilver's 9000 Pro on shader features (no ARB_fragment_program
// on 9200) and has only 32 MB VRAM. Baseline (vanilla 5.11):
// demo1 640 = 143 fps, 1024 = 113 fps — best PPC numbers in the fleet
// despite the GPU step-down, because the demo is CPU-bound and this
// chip has the CPU.
//
// Strategy: turn quality UP (we have CPU headroom and fillrate room
// at 1024), but be moderate about VRAM-heavy features since 32 MB is
// not 64 MB. Same fixed-function fragment path as the Radeon 9000 —
// no shader-based tricks.

// Display ----------------------------------------------------------
// Fullscreen by default at a SPECIFIC fixed 1024x768 (vid_desktopfullscreen
// 0) — not native: a larger external panel would push the Radeon 9200 below
// its 60 fps target. 1024x768 is the validated bench res. Applies from the
// 2nd launch; bench owns the mode via +set.
set vid_fullscreen 1
// Take the DESKTOP's own mode (same-mode capture, backends/sdl/refresh.c:251)
// rather than switching the display to a fixed size. A hardcoded resolution
// cannot promise to be displayable: the Quake 3 port shipped one that a cheap
// 1024x768 monitor could not sync to, and that machine could not start the game
// at all until it was changed. The values below stay as the fallback.
set vid_desktopfullscreen 1
set gl_mode -1
set gl_customwidth 1024
set gl_customheight 768

// Texture & VRAM ----------------------------------------------------
set gl_picmip 0                          // full texel detail at 32 MB VRAM
set gl_skymip 0                          // full-detail sky
set gl_round_down 0                      // round texture sizes UP for max quality
set gl_retexturing 1                     // hi-res textures ON — 32 MB is tight but viable for 1024 res
set gl_texturemode GL_LINEAR_MIPMAP_LINEAR   // trilinear; R9200 fillrate handles it
set gl_anisotropic 16                    // 16x AF — value is the AF degree, clamped to GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT (=16 on R200). Bench-neutral at demo res (commit c07b6eb: "R200=16")

// Dynamic lights ---------------------------------------------------
set gl_dynamic 1                         // full dlights — chip + 1.25 GHz CPU handle it easily
set gl_flashblend 0                      // prefer real lightmap reblend

// Shadows ----------------------------------------------------------
set gl_shadows 1                         // alias drop shadows ON
set gl_stencilshadow 1                   // RE-MEASURED 2026-08-21 inside scripts/bench.sh, both legs in one
                                         // session on the same harness: 41.10 fps ON vs 57.70 fps OFF at
                                         // demo1 1024x768. So the real cost is 29%, not the ~15% claimed by
                                         // the 2026-06-06 res=1 runs (which rendered 1x1 pixels and contained
                                         // no fill cost at all) and not the 24% from the 2026-08-20 pass,
                                         // which was run OUTSIDE bench.sh by invoking the engine directly.
                                         //
                                         // Kept ON. At 41.10 fps this machine is ABOVE the ~40 fps rule of
                                         // thumb, not under it: issue #7 opened on 38.8 fps and that no longer
                                         // reproduces. Real projected shadow volumes are worth 29% here.
                                         //
                                         // What this machine is actually bound by, measured the same day by
                                         // sweeping resolution with everything else fixed:
                                         //     640x480   76.95 fps
                                         //     800x600   59.00 fps
                                         //    1024x768   40.90 fps
                                         // Fitting frame time = fixed + per-pixel on the two extremes gives
                                         // 5.65 ms fixed and 23.9 ns/pixel (41.8 Mpixel/s), and that predicts
                                         // the held-out 800x600 point to within 1%. At 1024x768, 77% of the
                                         // frame is per-pixel fill; at 640x480 it is 57%. That is why toggling
                                         // individual features moved nothing: they live in the other 23%.
                                         // Issue #7.
set gl_glows 1                           // sphere-map energy glow on quad/invuln/etc. shells; single-pass texgen, ~free on R9200 multitex
set gl_trans_lighting 1           // lightmap-modulate glass/grates (KMQuake2 r_trans_lighting); multitex pass, map-load latched
set gl_caustics 1                 // animated additive caustic shimmer on water surfaces
set gl_bloom 0                    // available; OFF by default — fullscreen post is fillrate-heavy, A/B before enabling

// VSYNC, and why the bench number and the played number differ. Issue #7.
// -----------------------------------------------------------------------
// MEASURED 2026-08-23, this machine, demo1 1024x768, 3 runs per leg, both legs
// pinned explicitly through scripts/bench.sh EXTRA, zero spread on both:
//
//     gl_swapinterval 0    41.10 fps
//     gl_swapinterval 1    29.90 fps      <- what a player actually gets
//
// 29.90 is not a fill-rate wall. It is 60 Hz halved: the machine renders at
// 41.1 and misses the 60 Hz deadline, so vsync drops it to every second
// refresh. It matches scripts/smoke-dmg.sh, which runs the production config
// and has been reporting 29.9 all along.
//
// NOTHING SETS gl_swapinterval FOR THIS MACHINE. The engine default is 1
// (r_main.c:1206, CVAR_ARCHIVE) and only autoexec-arm64.cfg sets it anywhere in
// the bundle, so every PowerPC machine inherits vsync ON from the default or
// from whatever is archived. Same shape as the gl_farsee case: a decision
// expressed by silence is not enforced.
//
// LEFT ON DELIBERATELY. Turning it off buys 11 fps and costs tearing, and the
// user's stated preference is visuals over framerate; tearing is not a feature.
//
// The useful consequence may run the other way. Locked at 30, this machine
// discards 27% of what it can render, so a feature costing less than that MIGHT
// be free in what the player sees.
//
// THAT IS INFERRED, NOT MEASURED, and it is only as good as the assumption that
// vsync here is a clean 60/2 ladder. Measured on this machine the vsynced rate
// was exactly 29.90 with zero spread, which looks like a clean lock, but only
// that one point was ever measured. halflife measured its own engine on this
// same mini at 62.9 raw -> 42.276 vsynced, which is neither 60 nor 30: when raw
// sits just ABOVE the refresh there is no ladder and no headroom, and a small
// cost is AMPLIFIED because more frames miss the deadline. Different engine and
// different raw rate, so it does not transfer here, but it does show the ladder
// cannot be assumed.
//
// MEASURED 2026-08-23, both legs vsynced, and THE HEADROOM IDEA IS DEAD.
// Everything below is demo1 1024x768, 3 runs per leg, zero spread on every run:
//
//                          raw (vsync 0)   vsynced (vsync 1)
//     shipped, MSAA 2x         41.10            29.90
//     gl_msaa_samples 0        70.20            55.80
//     gl_bloom 1               14.80            14.20
//     gl_stencilshadow 0       57.60              --
//
// gl_bloom costs 64% and takes a player to 14.2 fps. It is not a candidate on
// this chip and the "fillrate-heavy, A/B before enabling" note above was right.
//
// AND VSYNC IS NOT A LADDER HERE. 70.20 raw gives 55.80, not 60. 14.80 gives
// 14.20, not 15 and not 12. Only the 41.10 -> 29.90 point looks like a clean
// halving, and one point is not a ladder. So the earlier reasoning -- 30 is a
// plateau, spend the 27% underneath it -- was wrong, and it was wrong because it
// was reasoning rather than measurement.
//
// THE REAL FINDING IS gl_msaa_samples 2, set at the bottom of this file. It
// costs 41% raw and 26 fps of what the player actually sees, 55.80 -> 29.90.
// That is a larger cost than stencil shadows (29%) and the largest single cost
// on this machine. Note MISTAKES.md records 2x MSAA at only -13.6% on
// quicksilver, which is also R200-class (Radeon 9000 Pro vs this 9200), so R200
// machines do NOT behave alike here and neither figure should be carried across.
//
// NOT CHANGED, because the decision turns on something nobody has written down:
// whether the ~40 fps G4 floor means the raw bench number or what a player sees.
// Raw, this machine is 41.10 and above it. Played, it is 29.90 and well under.
// Every floor figure in this repo's history is a vsync-off bench number, so the
// floor has probably always meant raw -- but the floor exists for playability,
// which is the played number. Turning MSAA off here would take a player from
// 29.90 to 55.80. That is a visible quality change resting on a definition, so
// it goes to the user rather than being taken by a session. Issue #7.

// Particles --------------------------------------------------------
set gl_ext_pointparameters 1             // point sprites for particles
set gl_ext_multitexture 1                // mtex lightmaps
set gl_ext_mtexcombine 1                 // texture combiners

// Frame submission -------------------------------------------------
set gl_finish 0
set gl_clear 0
set gl_ztrick 0
set gl_zfix 1                            // polygon-offset coplanar surfs — kills decal/brush z-fighting (near-free)
set gl_polyblend 1

// View / cosmetic --------------------------------------------------
set gl_modulate 1                        // engine default
// 2026-05-19: GL_RGB_SCALE_EXT 4 in the multitex combiner — Q3-style
// punchy lightmaps. R9200 fixed-function supports ARB_texture_env_combine
// and 4x sampler-stage scale at no extra cost vs 2x.
set gl_overbrightbits 4                  // Q3-style punchy lightmaps
set intensity 2                          // engine default
set vid_gamma 1.0
set horplus 1

// Fog (Phase C, cvar-driven GL_FOG) --------------------------------
// R9200 fixed-function GL_FOG is cheap; mini-g4 has fps headroom to spare.
set gl_fog 1
set gl_fog_mode 0
set gl_fog_start 64
set gl_fog_end 2048
set gl_fog_red 0.5
set gl_fog_green 0.5
set gl_fog_blue 0.55

// Waterwarp (Phase C #2) — underwater sin-warp via projection matrix
set gl_waterwarp 1

// Lightmap subrect upload (Phase B #1) — upload only dirty columns
// of the dynamic lightmap atlas each frame. gl_dynamic 0 machines
// (yosemite, sawtooth) execute no dynamic upload anyway, so this is
// a silent no-op on them. ON by default.
set gl_lightmap_subrect 1

// Group-draw (Phase B #3) — ON. R9200 / Tiger has the same ATI driver
// generation as quicksilver's R9000 Pro (post-Panther), so the same
// expectation applies. Not yet bench-validated.
set gl_groupdraw 1

// Client tier ------------------------------------------------------
set cl_maxfps 90                         // closer to the engine default (95); we have CPU
set cl_gun 2                             // full weapon lerp
set cl_particles 1
set cl_lights 1
set cl_blend 1
set cl_entities 1

// Sound ------------------------------------------------------------
set s_khz 44                             // full-rate 44 kHz mix

// Tier 2 — HUD pics on GL_NEAREST regardless of gl_texturemode
set r_2D_unfiltered 1

// World decals (KMQuake2 r_fragment.c port) ------------------------
// Bullet/blood/scorch marks on walls.
set gl_decals 1
set gl_decal_max 32
set gl_decal_life 20                     // sec before fade starts
set gl_decal_fade 3                      // sec to fade fully out

// MSAA (CVAR_LATCH — requires vid_restart to switch) ----------------
// Radeon 9200 — same generation as 9000
set gl_msaa_samples 2

// Textured point sprite particles (GL_ARB_point_sprite) ------------
// Glow textured particles instead of solid squares — needs R9000+/GMA950+.
set gl_pointsprites 1

// Watch "Tactical Computer" companion ------------------------------
// Arm Bonjour auto-discovery of the iPhone/Watch on the LAN so the feed
// "just works" on this box with no console command. MUST live here (the
// per-machine bundle autoexec runs AFTER config.cfg); a user-dir autoexec
// runs BEFORE config.cfg and would be overridden by its archived (empty)
// watch_host. Discovery is time-bounded (~30 s) and fully inert during
// timedemo/bench, so a phoneless game costs nothing.
set watch_host "auto"
set watch_port "27999"
