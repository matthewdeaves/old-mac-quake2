# Quake II's config for the shared deploy-dmg.sh / smoke-dmg.sh
# (old-mac-build-host#96). This file is ours and is never synced; the two
# scripts are buildhost's and are synced byte-identical. Variables are
# documented at the top of both scripts. Hooks are in dmg-hooks.sh.

PORT=quake2
DMG_PREFIX=Quake2-OldMac-
IMAGE_ROOT=.
INSTALL_DIR=/Applications/Quake2

# The runtime. baseq2/game.so is owned even though it lives in DATA_DIR.
OWNED=(Quake2.app ref_gl.so q2ded baseq2/game.so 'README.txt?' 'Fix and Install.command?' 'clear-launch-quarantine.sh?')
VERIFY=(Quake2.app/Contents/MacOS/quake2 ref_gl.so baseq2/game.so q2ded)

# baseq2/ holds the player's paks, players/ models and a user autoexec.cfg:
# never touched. A first install seeds it from the legacy dev-install location.
DATA_DIR=baseq2
FIRST_SEED=(quake2-play/baseq2)	# relative to ~

# Smoke: the production config plus a timedemo so it auto-exits (ADR 0009),
# and a live read-back of the video cvars that smoke_verdict checks.
PROC=quake2
SMOKE_ARGS=(-nolauncher +set logfile 2
	+gl_bloom +gl_msaa_samples +gl_mode +gl_customwidth +gl_customheight
	+vid_fullscreen +vid_desktopfullscreen +gl_swapinterval
	+set timedemo 1 +demomap '{DEMO}.dm2')
SMOKE_DEMO=demo1
SMOKE_LOG='~/.yq2/baseq2/qconsole.log'
PASS_RE='frames.*seconds.*fps'
FAIL_RE="Couldn't start the OpenGL renderer|Couldn't init SDL video"
# The shared quit is AppleScript, then TERM, then KILL: TERM first, as the
# R300 G5 needs (a hard KILL black-screens it).
KILL_OK=yes
SMOKE_MUTE=yes
# Timeouts carried from the old per-machine table (G3 slowest).
SMOKE_TIMEOUT_ppc750=300
SMOKE_TIMEOUT_ppc7400=180
SMOKE_TIMEOUT_ppc7450=120
SMOKE_TIMEOUT_ppc970=120
SMOKE_TIMEOUT_x86=60
SMOKE_TIMEOUT_arm64=45
