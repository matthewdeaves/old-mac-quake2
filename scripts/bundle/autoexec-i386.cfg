// yquake2 5.11 - per-arch baseline for i386 (32-bit-only Intel)
//   10.4 Tiger through 10.6.8 Snow Leopard.
//
// This slice exists for exactly four machines, the only Intel Macs with no
// 64-bit mode: Mac mini 1,1, iMac 4,1, MacBook 1,1 and MacBook Pro 1,1, all
// 2006 Core Solo or Core Duo. dyld grades a fat by CPU subtype alone and
// never falls back, so without this slice those machines are handed nothing
// at all and the app does not launch. It is not a nicety.
//
// NOT BENCHED. There is no 32-bit-only Intel Mac in the fleet, so nothing
// here has been measured on the hardware it targets. Every value is set from
// the part's documented capability and from the closest machine that HAS been
// measured, mini-intel, which has the same GMA 950 GPU. Treat these as a
// starting point, not as results.
//
// How this differs from mini-intel, and why. Every one of those machines has
// a GMA 950, the same GPU mini-intel was tuned on, so the GPU-side settings
// carry over unchanged. What does not carry over is the CPU: mini-intel is a
// 2.33 GHz Core 2 Duo, and a Core Solo is a single 1.5 GHz core. That is the
// whole basis for the reductions below. Where a setting costs GPU, it is
// kept; where it costs CPU, it is trimmed.

// Display ----------------------------------------------------------
// 800x600 rather than mini-intel's 1024x768. The GMA 950 has no hardware
// T&L, so the CPU feeds it every transformed vertex, and on a single core
// that is the binding constraint rather than fill rate.
set vid_fullscreen 1
set vid_desktopfullscreen 0
set gl_mode -1
set gl_customwidth 800
set gl_customheight 600

// Texture & VRAM ----------------------------------------------------
// The GMA 950 has no dedicated VRAM, it borrows system memory, and these
// machines shipped with 512 MB to 2 GB total. picmip 1 rather than 0 keeps
// the working set small enough that texture upload does not thrash.
set gl_picmip 1
set gl_skymip 0
set gl_round_down 1                      // round texture sizes DOWN, unlike the 64-bit slice
set gl_retexturing 0                     // hi-res packs cost CPU at map load to decode
set gl_texturemode GL_LINEAR_MIPMAP_LINEAR
set gl_anisotropic 2                     // sampler-stage, cheap; clamped by the driver anyway

// Dynamic lights ---------------------------------------------------
// OFF. R_BuildLightMap plus R_AddDynamicLights is per-luxel float work on
// the CPU, and it was measured as the binding cost on sawtooth (a 500 MHz
// single-core G4) rather than a bandwidth problem. A Core Solo is in the
// same position: one core, no help.
set gl_dynamic 0
set gl_flashblend 1                      // cheap additive billboard halos instead

// Shadows ----------------------------------------------------------
set gl_shadows 1                         // alias drop shadows, cheap blend
set gl_stencilshadow 0                   // OFF. Measured at ~24% on mini-g4 at native res, and that is a machine with a real GPU. Revisit if one of these is ever benched.
set gl_glows 1                           // single-pass texgen, GPU-side, near free
set gl_trans_lighting 1                  // multitex pass, latched at map load
set gl_caustics 1                        // additive shimmer, GPU-side
set gl_bloom 0                           // fullscreen post, and broken on GL1 drivers anyway

// Particles --------------------------------------------------------
set gl_ext_pointparameters 1             // GMA 950 point sprites work
set gl_ext_multitexture 1
set gl_ext_mtexcombine 1
set gl_particle_min_size 1
set gl_particle_max_size 32

// Frame submission -------------------------------------------------
set gl_finish 0                          // Apple's GMA driver stalls badly on glFinish, never enable
set gl_clear 0
set gl_ztrick 0
set gl_zfix 1
set gl_polyblend 1

// View / cosmetic --------------------------------------------------
set gl_modulate 1
set gl_overbrightbits 2                  // 2 not 4: the GMA combiner path is slower than the R200's
set intensity 2
set vid_gamma 1.0
set horplus 1

// Fog --------------------------------------------------------------
set gl_fog 1                             // fixed-function GL_FOG, essentially free
set gl_fog_mode 0
set gl_fog_start 64
set gl_fog_end 2048
set gl_fog_red 0.5
set gl_fog_green 0.5
set gl_fog_blue 0.55

set gl_waterwarp 1                       // projection-matrix warp, no extra pass
set gl_lightmap_subrect 1                // no-op while gl_dynamic is 0
set gl_groupdraw 1                       // vertex arrays rather than immediate mode

// Client tier ------------------------------------------------------
set cl_maxfps 60                         // one core, leave budget for AI and physics
set cl_gun 2
set cl_particles 1
set cl_lights 1
set cl_blend 1
set cl_entities 1

// Sound ------------------------------------------------------------
set s_khz 22                             // half-rate mix, the mixer runs on the same single core

// HUD pics on GL_NEAREST regardless of gl_texturemode
set r_2D_unfiltered 1

// World decals -----------------------------------------------------
set gl_decals 1
set gl_decal_max 16                      // half the 64-bit slice's budget
set gl_decal_life 20
set gl_decal_fade 3

// MSAA (CVAR_LATCH) ------------------------------------------------
set gl_msaa_samples 0                    // the GMA 950 has no fill rate to spare for it

set gl_pointsprites 1

// Watch "Tactical Computer" companion ------------------------------
// See autoexec-mini-intel.cfg for the rationale.
set watch_host "auto"
set watch_port "27999"
